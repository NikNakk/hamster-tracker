<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hamster Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --strava-orange: #fc4c02;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #242428;
      --muted: #8a8a94;
      --border: #ececf0;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      background: #111;
      color: #fff;
      border-bottom: 3px solid var(--strava-orange);
      padding: 0.9rem 1.25rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .topbar span {
      color: var(--strava-orange);
      margin-right: 0.4rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
    }

    .meta {
      margin: 0.5rem 0 1rem;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }

    .metric-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .metric-value {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.15;
    }

    .metric-value.emphasis { color: var(--strava-orange); }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 0.8rem;
    }

    #map {
      height: 430px;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      width: 100% !important;
      height: 310px !important;
    }
  </style>
</head>
<body>
  <div class="topbar"><span>STRAVA</span>HAMSTER TRACKER</div>

  <main class="container">
    <p class="meta">Auto-refreshes every 30 seconds.</p>

    <section class="grid">
      <div class="card">
        <div class="metric-label">Distance</div>
        <div id="distance" class="metric-value emphasis">--</div>
      </div>
      <div class="card">
        <div class="metric-label">Elapsed time</div>
        <div id="elapsed" class="metric-value">--</div>
      </div>
      <div class="card">
        <div class="metric-label">Average speed</div>
        <div id="avgSpeed" class="metric-value">--</div>
      </div>
      <div class="card">
        <div class="metric-label">Updated</div>
        <div id="updated" class="metric-value" style="font-size:1.1rem;">--</div>
      </div>
    </section>

    <section class="card" style="margin-bottom: 1rem;">
      <h2 class="panel-title">Route Map</h2>
      <div id="map"></div>
    </section>

    <section class="card" style="margin-bottom: 1rem;">
      <h2 class="panel-title">Distance Over Time</h2>
      <canvas id="distanceChart"></canvas>
    </section>

    <section class="card">
      <h2 class="panel-title">Average Speed Over Time</h2>
      <canvas id="speedChart"></canvas>
    </section>
  </main>

  <script>
    const dataUrl = "./hamster-data.json";

    const map = L.map("map");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    let marker = null;
    let polyline = null;
    let distanceChart = null;
    let speedChart = null;
    let firstLoad = true;

    function formatElapsed(seconds) {
      const s = Math.max(0, Number(seconds || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}h ${m}m ${sec}s`;
      return `${m}m ${sec}s`;
    }

    function formatUpdated(ts) {
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return ts || "--";
      return d.toLocaleString();
    }

    function setMetric(id, text) {
      document.getElementById(id).textContent = text;
    }

    function buildOrUpdateChart(existingChart, canvasId, label, labels, values, color) {
      if (existingChart) {
        existingChart.data.labels = labels;
        existingChart.data.datasets[0].data = values;
        existingChart.update();
        return existingChart;
      }

      return new Chart(document.getElementById(canvasId), {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: label,
            data: values,
            borderColor: color,
            backgroundColor: color + "22",
            fill: true,
            pointRadius: 2,
            pointHoverRadius: 4,
            tension: 0.25
          }]
        },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: {
              ticks: { maxTicksLimit: 8 },
              grid: { color: "#f0f1f4" }
            },
            y: {
              grid: { color: "#f0f1f4" }
            }
          }
        }
      });
    }

    async function refresh() {
      const res = await fetch(dataUrl + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      const current = data.current || {};
      const history = Array.isArray(data.history) ? data.history : [];

      setMetric("distance", `${Number(current.distance_km || 0).toFixed(2)} km`);
      setMetric("elapsed", formatElapsed(current.elapsed_s));
      setMetric("avgSpeed", `${Number(current.avg_speed_kmh || 0).toFixed(1)} km/h`);
      setMetric("updated", formatUpdated(current.updated));

      const latlngs = history
        .filter(p => Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lon)))
        .map(p => [Number(p.lat), Number(p.lon)]);

      if (latlngs.length) {
        const latest = latlngs[latlngs.length - 1];

        if (!polyline) {
          polyline = L.polyline(latlngs, { color: "#fc4c02", weight: 4 }).addTo(map);
        } else {
          polyline.setLatLngs(latlngs);
        }

        if (!marker) {
          marker = L.marker(latest).addTo(map);
        } else {
          marker.setLatLng(latest);
        }

        if (firstLoad) {
          map.fitBounds(polyline.getBounds(), { padding: [20, 20] });
          firstLoad = false;
        } else {
          map.panTo(latest);
        }
      }

      const labels = history.map(p => {
        const d = new Date(p.t);
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      });

      distanceChart = buildOrUpdateChart(
        distanceChart,
        "distanceChart",
        "Distance (km)",
        labels,
        history.map(p => Number(p.distance_km || 0)),
        "#fc4c02"
      );

      speedChart = buildOrUpdateChart(
        speedChart,
        "speedChart",
        "Average speed (km/h)",
        labels,
        history.map(p => Number(p.avg_speed_kmh || 0)),
        "#1f6feb"
      );
    }

    async function loop() {
      try {
        await refresh();
      } catch (err) {
        console.error(err);
      }
    }

    loop();
    setInterval(loop, 30000);
  </script>
</body>
</html>
